# Rsyslog endepunkt: lokal innsamling og videresending over TLS (RFC 5425) til SIEM.
# Målport 6514/tcp. Tidsstempel: RFC 3339 / ISO 8601.
# NIST SP 800-53 Rev. 5: AU-3, AU-8, AU-9, AU-12.
# NIST SP 800-92: logggenerering, overføring, beskyttelse av loggdata i transitt.
#
# Før produksjon:
#   - Bytt PLACEHOLDER.host.example.internal til manager/relé FQDN
#   - Legg inn CA, klient-sertifikat og nøkkel under /etc/rsyslog.d/tls/
#   - Krever rsyslog-gnutls (Debian/Ubuntu) eller rsyslog-openssl, avhengig av distro
#   - $DefaultNetstreamDriver gtls forutsetter GnuTLS-modulen

module(load="imuxsock")
module(load="imjournal" PersistStateInterval="100"
       StateFile="/var/lib/rsyslog/imjournal.state")
module(load="imklog")
module(load="imfile" PollingInterval="10")
module(load="omfwd")

global(
  workDirectory="/var/lib/rsyslog"
  umask="0022"
  preserveFQDN="on"
)

# ISO 8601 / RFC 3339 (UTC). Unngå lokal tid i videresendte poster.
template(name="FwdRFC5424ISO8601" type="string"
  string="<%PRI%>1 %timestamp:::date-rfc3339% %HOSTNAME% %app-name% %procid% %msgid% %structured-data% %msg%\n")

template(name="FileISO8601" type="string"
  string="%timestamp:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n")

# Lokale filer (AU-9: tilgangsrettigheter settes av logrotate/systemd, ikke her).
*.info;mail.none;authpriv.none;cron.none  /var/log/messages;FileISO8601
auth,authpriv.*                            /var/log/auth.log;FileISO8601
*.emerg                                    :omusrmsg:*

# Les auditd-fil dersom audisp-syslog ikke brukes. agent leser samme sti via ossec.conf.
input(type="imfile"
  File="/var/log/audit/audit.log"
  Tag="auditd:"
  Severity="info"
  Facility="local6"
  PersistStateInterval="100"
  reopenOnTruncate="on")

# TLS mot loggrelé / Wazuh syslog-inntak bak TLS-terminering.
# AuthMode x509/name: peer-navn må matche sertifikatets CN/SAN.
action(
  type="omfwd"
  protocol="tcp"
  target="PLACEHOLDER.host.example.internal"
  port="6514"
  template="FwdRFC5424ISO8601"
  StreamDriver="gtls"
  StreamDriverMode="1"
  StreamDriverAuthMode="x509/name"
  StreamDriverPermittedPeers="PLACEHOLDER.host.example.internal"
  ResendLastMSGOnReconnect="on"
  queue.filename="fwd-siem-tls"
  queue.maxdiskspace="1g"
  queue.type="LinkedList"
  queue.saveonshutdown="on"
  action.resumeRetryCount="-1"
)

# GnuTLS-filer (påkrevd når StreamDriver=gtls).
global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/rsyslog.d/tls/ca.pem"
  DefaultNetstreamDriverCertFile="/etc/rsyslog.d/tls/client-cert.pem"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/tls/client-key.pem"
)
