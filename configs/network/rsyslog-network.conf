# Rsyslog på nettverksrelé (mellom svitsj/brannmur og Wazuh).
# Mottar UDP/TCP 514 fra infrastruktur, videresender RFC 5424 over TLS 6514.
# NIST SP 800-53 Rev. 5: AU-3, AU-8, AU-9, AU-12.

module(load="imudp")
input(type="imudp" port="514" ruleset="from-network")

module(load="imtcp")
input(type="imtcp" port="514" ruleset="from-network")

module(load="omfwd")

template(name="NetFwdRFC5424ISO8601" type="string"
  string="<%PRI%>1 %timestamp:::date-rfc3339% %HOSTNAME% %app-name% %procid% %msgid% %structured-data% %msg%\n")

# Behold original hostname fra enheten der det finnes i meldingen.
template(name="NetRawFile" type="string"
  string="%timestamp:::date-rfc3339% %fromhost-ip% %HOSTNAME% %syslogtag%%msg%\n")

ruleset(name="from-network") {
  action(
    type="omfile"
    file="/var/log/network/devices.log"
    template="NetRawFile"
    fileCreateMode="0640"
    dirCreateMode="0750"
  )

  action(
    type="omfwd"
    protocol="tcp"
    target="PLACEHOLDER.host.example.internal"
    port="6514"
    template="NetFwdRFC5424ISO8601"
    StreamDriver="gtls"
    StreamDriverMode="1"
    StreamDriverAuthMode="x509/name"
    StreamDriverPermittedPeers="PLACEHOLDER.host.example.internal"
    queue.filename="net-fwd-siem"
    queue.type="LinkedList"
    queue.maxdiskspace="2g"
    queue.saveonshutdown="on"
    action.resumeRetryCount="-1"
  )
}

global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/rsyslog.d/tls/ca.pem"
  DefaultNetstreamDriverCertFile="/etc/rsyslog.d/tls/relay-cert.pem"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/tls/relay-key.pem"
)
